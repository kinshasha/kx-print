; KX-Print — Arduino UNO R4 WiFi (Renesas RA4M1 + ESP32-S3 radio)
; This is NOT an ESP32 sketch. Do not use ESP32 Arduino APIs.

[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -DARDUINO_UNOWIFIR4
  -I.
  -DKX_FW_VERSION=\"1.0.0\"
lib_deps =
  arduino-libraries/ArduinoMDNS@^1.0.1

[env:dry_run]
extends = env:uno_r4_wifi
build_flags =
  ${env:uno_r4_wifi.build_flags}
  -DKX_DRY_RUN_DEFAULT=1
